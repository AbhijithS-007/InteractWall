<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Wallpaper</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <script type="importmap">
        {
            "imports": {
                "three": "./three.module.js",
                "../utils/BufferGeometryUtils.js": "./BufferGeometryUtils.js"
            }
        }
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from './GLTFLoader.js';

        let isPaused = false;
        let lastX = 0, lastY = 0;

        // ---- Three.js setup ----
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000); 

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 3;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1.2);
        directionalLight.position.set(0, 0, 1); // point from camera
        camera.add(directionalLight);
        scene.add(camera);

        let model = null;
        let targetRotationX = 0;
        let targetRotationY = 0;

        function loadModel(url) {
            if (model) {
                scene.remove(model);
                model = null;
            }
            if (!url) return;

            const loader = new GLTFLoader();
            console.log("[WebWallpaper] Attempting to load model path:", `./${url}`);
            
            loader.load(`./${url}`, (gltf) => {
                console.log("[WebWallpaper] Successfully loaded model:", url);
                model = gltf.scene;
                
                // Position camera to fit model
                const box = new THREE.Box3().setFromObject(model);
                const size = box.getSize(new THREE.Vector3()).length();
                const center = box.getCenter(new THREE.Vector3());
                
                console.log(`[WebWallpaper] Model Size: ${size}, Center: ${center.x}, ${center.y}, ${center.z}`);

                // Dynamically adjust clipping planes to accommodate extremely large or small models
                camera.near = size / 100;
                camera.far = size * 100;
                camera.updateProjectionMatrix();

                // Do not move the model. Just move the camera to look at its bounding center
                camera.position.copy(center);
                camera.position.z += size * 1.0; 
                camera.lookAt(center);

                scene.add(model);
            }, undefined, (error) => {
                console.error("[WebWallpaper] GLTFLoader ERROR loading", url, ":", error);
                // Secondary fetch to check exact HTTP status code
                fetch(`./${url}`).then(res => {
                    console.error("[WebWallpaper] HTTP Status for", url, "was:", res.status, res.statusText);
                }).catch(err => {
                    console.error("[WebWallpaper] Fetch API also failed:", err);
                });
            });
        }

        // ---- IPC from C++ host ----
        if (window.chrome && window.chrome.webview) {
            window.chrome.webview.addEventListener('message', event => {
                let d = event.data;
                if (typeof d === 'string') {
                    try { d = JSON.parse(d); } catch (e) { return; }
                }

                if (d && d.type === 'config') {
                    if (d.backgroundType === 'color' && d.backgroundColor) {
                        scene.background = new THREE.Color(d.backgroundColor);
                    } else if (d.backgroundType === 'image' && d.backgroundImage) {
                        const texLoader = new THREE.TextureLoader();
                        texLoader.load(`./${d.backgroundImage}`, (tex) => {
                            scene.background = tex;
                        });
                    }
                    if (d.model) {
                        loadModel(d.model);
                    }
                }
                else if (d && d.type === 'mousemove') {
                    lastX = d.x;
                    lastY = d.y;
                    targetRotationY = d.x * Math.PI * 0.2;
                    targetRotationX = d.y * Math.PI * 0.2;
                }
                else if (d && d.type === 'power') {
                    if (d.action === 'pause') isPaused = true;
                    if (d.action === 'resume') isPaused = false;
                }
            });
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            if (isPaused) return;

            if (model) {
                model.rotation.y += (targetRotationY - model.rotation.y) * 0.1;
                model.rotation.x += (targetRotationX - model.rotation.x) * 0.1;
            }
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
